<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #e0f7fa;
      color: #004d40;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #00796b;
    }
    p {
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .rating {
      direction: rtl;
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .rating input {
      display: none;
    }
    .rating label {
      font-size: 2rem;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
      margin: 0 5px;
    }

    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: #ffca28;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    button {
      background-color: #00796b;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #004d40;
    }
    textarea {
      display: block;
      margin: 0 auto;
      width: 80%;
      max-width: 500px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: vertical;
    }
  </style>
</head>
<body>
  <header>
    <h1>Feedback</h1>
  </header>
  <main>
    <p>We value your feedback! Please share your experience with KeyStorm.</p>

    <div class="rating">
      <input type="radio" id="star5" name="rating" value="5" />
      <label for="star5">★</label>
      <input type="radio" id="star4" name="rating" value="4" />
      <label for="star4">★</label>
      <input type="radio" id="star3" name="rating" value="3" />
      <label for="star3">★</label>
      <input type="radio" id="star2" name="rating" value="2" />
      <label for="star2">★</label>
      <input type="radio" id="star1" name="rating" value="1" />
      <label for="star1">★</label>
    </div>

    <textarea rows="10" cols="50" placeholder="Your feedback..."></textarea>

    <div class="button-container">
      <button id="submit-feedback">Submit Feedback</button>
      <button id="back-button">Back to Home</button>
    </div>
  </main>

  <script>
    document.getElementById('back-button').addEventListener('click', function () {
      window.location.href = 'index.html';
    });

    document.getElementById('submit-feedback').addEventListener('click', function () {
      const rating = document.querySelector('input[name="rating"]:checked');
      const feedbackText = document.querySelector('textarea').value;
      if (rating && feedbackText.trim()) {
        alert(`Thank you for your feedback!\nRating: ${rating.value} stars\nFeedback: ${feedbackText}`);
        // Add fetch() or backend logic here
      } else {
        alert('Please provide a rating and your feedback.');
      }
    });
  </script>
</body>
</html>
